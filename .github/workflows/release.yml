name: Release

# Push a tag such as v1.0.0 to publish that commit's retro_trivia.py, unchanged,
# as a GitHub release. NetBBS vendors exactly this file (Thiesi/NetBBS#1226),
# so the asset must be byte-identical to what git stores at the tag. The NetBBS
# door profile goes with it, for SysOps who run a release ahead of the bundled
# copy, and the notes open with the NetBBS line those SysOps check (#23).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Tests
        run: |
          python -m pip install "pytest>=7.0" "pytest-xdist>=3.0"
          python -m pytest -q -n auto
      - name: Check the assets are the stored files
        run: |
          for file in retro_trivia.py profiles/netbbs.json; do
            test "$(git hash-object "$file")" = "$(git rev-parse "$GITHUB_REF_NAME:$file")"
          done
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp profiles/netbbs.json netbbs.json
          sha256sum retro_trivia.py netbbs.json > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" retro_trivia.py netbbs.json SHA256SUMS \
            --title "Retro Trivia $GITHUB_REF_NAME" --verify-tag --generate-notes \
            --notes "**NetBBS:** keeps no saved data, so this release can run ahead of the copy NetBBS bundles."
